<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">

  <!-- Sky / background -->
  <rect width="900" height="320" fill="#0d1117"/>

  <!-- Stars -->
  <circle cx="60" cy="30" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="130" cy="18" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="210" cy="40" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="350" cy="22" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="500" cy="14" r="1.2" fill="#ffffff" opacity="0.4"/>
  <circle cx="620" cy="35" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="750" cy="20" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="840" cy="45" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="880" cy="12" r="1.2" fill="#ffffff" opacity="0.3"/>

  <!-- Ground -->
  <rect x="0" y="265" width="900" height="55" fill="#161b22"/>
  <rect x="0" y="262" width="900" height="4" fill="#21262d"/>

  <!-- ══ TERMINAL / SHIELD character (left) ══ -->
  <!-- Monitor body -->
  <rect x="30" y="130" width="130" height="110" rx="10" fill="#1f2937" stroke="#3fb950" stroke-width="2"/>
  <rect x="42" y="142" width="106" height="72" rx="4" fill="#0d1117"/>
  <!-- Screen glow lines -->
  <text x="50" y="160" font-family="monospace" font-size="7" fill="#3fb950">$ ./detect.sh</text>
  <text x="50" y="171" font-family="monospace" font-size="7" fill="#3fb950">🛡 Loading rules...</text>
  <text x="50" y="182" font-family="monospace" font-size="7" fill="#f0883e">⚠ THREAT FOUND</text>
  <text x="50" y="193" font-family="monospace" font-size="7" fill="#ff4444">💀 KILLING PID 1337</text>
  <text x="50" y="204" font-family="monospace" font-size="7" fill="#3fb950">✓ Alert sent →</text>
  <!-- Monitor stand -->
  <rect x="82" y="240" width="26" height="16" rx="3" fill="#1f2937"/>
  <rect x="68" y="254" width="54" height="8" rx="4" fill="#1f2937"/>
  <!-- Shield badge on monitor -->
  <polygon points="95,108 115,115 115,135 95,143 75,135 75,115" fill="#3fb950" opacity="0.9"/>
  <text x="95" y="131" text-anchor="middle" font-size="13" fill="#0d1117" font-weight="bold">🛡</text>

  <!-- ══ RANSOMWARE VILLAIN (center-left) ══ -->
  <!-- Body -->
  <ellipse cx="320" cy="200" rx="36" ry="42" fill="#ff4444"/>
  <!-- Face -->
  <circle cx="320" cy="178" r="26" fill="#ff6666"/>
  <!-- Evil eyes -->
  <ellipse cx="311" cy="173" rx="7" ry="8" fill="#ffffff"/>
  <ellipse cx="329" cy="173" rx="7" ry="8" fill="#ffffff"/>
  <circle cx="313" cy="175" r="4" fill="#1a0000"/>
  <circle cx="331" cy="175" r="4" fill="#1a0000"/>
  <circle cx="315" cy="173" r="1.5" fill="#ffffff"/>
  <circle cx="333" cy="173" r="1.5" fill="#ffffff"/>
  <!-- Evil grin -->
  <path d="M308 185 Q320 196 332 185" stroke="#1a0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="313" y="185" width="5" height="5" fill="#ffffff"/>
  <rect x="320" y="185" width="5" height="5" fill="#ffffff"/>
  <!-- Horns -->
  <polygon points="305,155 298,138 315,150" fill="#cc0000"/>
  <polygon points="335,155 342,138 325,150" fill="#cc0000"/>
  <!-- Arms holding lock/key -->
  <path d="M284 200 Q265 210 258 230" stroke="#ff4444" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M356 200 Q375 210 382 230" stroke="#ff4444" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Lock in left hand -->
  <rect x="240" y="226" width="24" height="20" rx="4" fill="#ffcc00"/>
  <path d="M246 226 Q246 216 252 216 Q258 216 258 226" stroke="#ffcc00" stroke-width="4" fill="none"/>
  <circle cx="252" cy="235" r="3" fill="#cc9900"/>
  <!-- Encryption key in right hand -->
  <circle cx="390" cy="236" r="9" fill="#ffcc00" stroke="#cc9900" stroke-width="2"/>
  <rect x="396" y="233" width="18" height="5" rx="2" fill="#ffcc00"/>
  <rect x="408" y="238" width="5" height="5" rx="1" fill="#ffcc00"/>
  <rect x="415" y="238" width="5" height="5" rx="1" fill="#ffcc00"/>
  <!-- Villain label -->
  <rect x="284" y="248" width="72" height="18" rx="9" fill="#ff2222" opacity="0.85"/>
  <text x="320" y="261" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="700">RANSOMWARE</text>

  <!-- ══ CANARY DECOY FILES (center) — tripping the villain ══ -->
  <!-- Canary bird 1 -->
  <ellipse cx="490" cy="230" rx="20" ry="16" fill="#ffd700"/>
  <circle cx="490" cy="212" r="13" fill="#ffd700"/>
  <!-- beak -->
  <polygon points="497,212 507,215 497,218" fill="#ff8c00"/>
  <!-- eye -->
  <circle cx="492" cy="210" r="3" fill="#1a1a1a"/>
  <circle cx="493" cy="209" r="1" fill="#ffffff"/>
  <!-- wing -->
  <ellipse cx="475" cy="228" rx="10" ry="6" fill="#ffb800" transform="rotate(-20,475,228)"/>
  <!-- legs -->
  <line x1="485" y1="246" x2="480" y2="262" stroke="#ff8c00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="495" y1="246" x2="500" y2="262" stroke="#ff8c00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tiny file icon the canary is sitting on -->
  <rect x="476" y="258" width="28" height="20" rx="3" fill="#1f6feb" opacity="0.9"/>
  <text x="490" y="272" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="600">DECOY</text>

  <!-- Canary bird 2 (smaller, right) -->
  <ellipse cx="555" cy="238" rx="14" ry="11" fill="#ffd700"/>
  <circle cx="555" cy="224" r="10" fill="#ffd700"/>
  <polygon points="562,224 570,226 562,228" fill="#ff8c00"/>
  <circle cx="557" cy="222" r="2.5" fill="#1a1a1a"/>
  <circle cx="558" cy="221" r="1" fill="#ffffff"/>
  <ellipse cx="543" cy="236" rx="7" ry="4" fill="#ffb800" transform="rotate(-20,543,236)"/>
  <line x1="551" y1="249" x2="547" y2="262" stroke="#ff8c00" stroke-width="2" stroke-linecap="round"/>
  <line x1="559" y1="249" x2="563" y2="262" stroke="#ff8c00" stroke-width="2" stroke-linecap="round"/>
  <rect x="542" y="258" width="26" height="18" rx="3" fill="#1f6feb" opacity="0.9"/>
  <text x="555" y="271" text-anchor="middle" font-size="7" fill="#ffffff" font-weight="600">DECOY</text>

  <!-- Speech bubble from canary 1 -->
  <rect x="504" y="185" width="90" height="30" rx="12" fill="#ffd700"/>
  <polygon points="510,215 500,230 522,215" fill="#ffd700"/>
  <text x="549" y="198" text-anchor="middle" font-size="9" fill="#1a1a1a" font-weight="700">SURPRISE! 🐦</text>
  <text x="549" y="210" text-anchor="middle" font-size="8" fill="#5a3e00">I'm a trap file!</text>

  <!-- ══ MINIFILTER BOUNCER (right) ══ -->
  <!-- Bouncer body -->
  <rect x="700" y="168" width="60" height="80" rx="8" fill="#1f3a1f"/>
  <!-- Head -->
  <circle cx="730" cy="155" r="28" fill="#2d5a1b"/>
  <!-- Sunglasses -->
  <rect x="712" y="148" width="16" height="10" rx="4" fill="#111"/>
  <rect x="732" y="148" width="16" height="10" rx="4" fill="#111"/>
  <line x1="728" y1="153" x2="732" y2="153" stroke="#111" stroke-width="2"/>
  <!-- Stern mouth -->
  <line x1="720" y1="170" x2="740" y2="170" stroke="#1a3a0a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arm blocking -->
  <path d="M700 195 Q675 185 660 175" stroke="#1f3a1f" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- STOP hand -->
  <circle cx="654" cy="172" r="16" fill="#3fb950"/>
  <text x="654" y="177" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="900">✋</text>
  <!-- Badge -->
  <rect x="712" y="178" width="36" height="22" rx="4" fill="#f0883e"/>
  <text x="730" y="188" text-anchor="middle" font-size="7" fill="#ffffff" font-weight="700">MINIFILTER</text>
  <text x="730" y="197" text-anchor="middle" font-size="7" fill="#ffffff" font-weight="700">DRIVER</text>
  <!-- Legs -->
  <rect x="706" y="246" width="18" height="22" rx="4" fill="#1f3a1f"/>
  <rect x="736" y="246" width="18" height="22" rx="4" fill="#1f3a1f"/>
  <!-- Boots -->
  <rect x="702" y="264" width="26" height="10" rx="4" fill="#111"/>
  <rect x="732" y="264" width="26" height="10" rx="4" fill="#111"/>

  <!-- Speech bubble from bouncer -->
  <rect x="620" y="110" width="130" height="36" rx="12" fill="#3fb950"/>
  <polygon points="700,146 715,130 720,148" fill="#3fb950"/>
  <text x="685" y="125" text-anchor="middle" font-size="9" fill="#0d1117" font-weight="700">ACCESS DENIED 🚫</text>
  <text x="685" y="139" text-anchor="middle" font-size="8" fill="#0a2a0a">FltSendMessage says NO.</text>

  <!-- ══ ALERT FLYING TO DASHBOARD ══ -->
  <!-- Dotted path from monitor area -->
  <path d="M160 185 Q230 140 290 160" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <!-- Alert envelope -->
  <rect x="228" y="148" width="44" height="30" rx="4" fill="#ff4444"/>
  <polygon points="228,148 250,165 272,148" fill="#cc2222"/>
  <text x="250" y="169" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="700">ALERT!</text>

  <!-- ══ TITLE BANNER ══ -->
  <rect x="180" y="22" width="540" height="70" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <!-- accent line -->
  <rect x="194" y="36" width="4" height="42" rx="2" fill="#3fb950"/>
  <text x="450" y="52" text-anchor="middle" font-size="22" font-weight="800" fill="#e6edf3" letter-spacing="1">RansomWatch</text>
  <text x="450" y="72" text-anchor="middle" font-size="11" fill="#7d8590" letter-spacing="2">Windows Ransomware Early Detection &amp; Response System</text>
  <!-- little badges -->
  <rect x="294" y="80" width="52" height="14" rx="7" fill="#1a3a0a"/>
  <text x="320" y="91" text-anchor="middle" font-size="8" fill="#3fb950" font-weight="600">C# · Java · React</text>
  <rect x="354" y="80" width="50" height="14" rx="7" fill="#1a1a3a"/>
  <text x="379" y="91" text-anchor="middle" font-size="8" fill="#58a6ff" font-weight="600">Windows</text>
  <rect x="412" y="80" width="60" height="14" rx="7" fill="#2a1a00"/>
  <text x="442" y="91" text-anchor="middle" font-size="8" fill="#f0883e" font-weight="600">Kernel Driver</text>
  <rect x="480" y="80" width="58" height="14" rx="7" fill="#2a0000"/>
  <text x="509" y="91" text-anchor="middle" font-size="8" fill="#ff4444" font-weight="600">Anti-Ransom</text>
  <rect x="546" y="80" width="62" height="14" rx="7" fill="#1a1a1a"/>
  <text x="577" y="91" text-anchor="middle" font-size="8" fill="#ffd700" font-weight="600">Canary Files 🐦</text>

  <!-- ══ FLOOR DETAILS ══ -->
  <!-- ETW radar dish on ground -->
  <rect x="810" y="220" width="6" height="44" fill="#3b82c4"/>
  <ellipse cx="813" cy="218" rx="28" ry="10" fill="none" stroke="#3b82c4" stroke-width="2"/>
  <ellipse cx="813" cy="218" rx="18" ry="6" fill="none" stroke="#3b82c4" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="813" cy="218" rx="8" ry="3" fill="none" stroke="#3b82c4" stroke-width="1" opacity="0.4"/>
  <text x="813" y="275" text-anchor="middle" font-size="8" fill="#3b82c4" font-weight="600">ETW</text>

  <!-- little "named pipe" pipe on floor -->
  <rect x="420" y="254" width="60" height="10" rx="5" fill="#555"/>
  <rect x="416" y="250" width="10" height="18" rx="5" fill="#444"/>
  <rect x="474" y="250" width="10" height="18" rx="5" fill="#444"/>
  <text x="450" y="276" text-anchor="middle" font-size="7" fill="#888">named pipe</text>

  <!-- ══ TAGLINE bottom ══ -->
  <text x="450" y="305" text-anchor="middle" font-size="10" fill="#444c56" font-style="italic">"Your files are bait. The canary sings. The driver blocks. The villain cries." 🐦🛡️💀</text>

</svg>
